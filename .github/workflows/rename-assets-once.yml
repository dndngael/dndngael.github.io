name: Rename assets directory once

on:
  push:
    branches:
      - v4
    paths:
      - ".github/workflows/rename-assets-once.yml"

permissions:
  contents: write

jobs:
  rename-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0

      - name: Rename assets folder and update references
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "content/4 Assets" ]; then
            git mv "content/4 Assets" "content/Assets"
          fi

          python - <<'PY'
          from pathlib import Path

          skip = Path('.github/workflows/rename-assets-once.yml')
          for path in Path('.').rglob('*'):
              if not path.is_file() or path == skip or '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if '4 Assets' in text:
                  path.write_text(text.replace('4 Assets', 'Assets'), encoding='utf-8')
          PY

          git add -A
          if git diff --cached --quiet; then
            echo "No asset migration changes were needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rename assets directory"
          git push origin HEAD:v4
